services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vulnlab
      POSTGRES_USER: vulnlab
      POSTGRES_PASSWORD: vulnlab
    ports:
      - "5434:5432"
    volumes:
      - postgres_insecure_data:/var/lib/postgresql/data

  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: vulnlab
      MONGO_INITDB_ROOT_PASSWORD: vulnlab
      MONGO_DATABASE: vulnlab_docs
    ports:
      - "27019:27017"
    volumes:
      - mongo_insecure_data:/data/db

  backend:
    build:
      context: ./backend
    user: root
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: vulnlab
      POSTGRES_USER: vulnlab
      POSTGRES_PASSWORD: vulnlab
      MONGO_HOST: mongo
      MONGO_PORT: 27017
      MONGO_INITDB_ROOT_USERNAME: vulnlab
      MONGO_INITDB_ROOT_PASSWORD: vulnlab
      MONGO_DATABASE: vulnlab_docs
      APP_SECURITY_MODE: INSECURE
      APP_CORS_ALLOWED_ORIGINS: http://localhost:8085
    ports:
      - "8084:8080"
    depends_on:
      - postgres
      - mongo

  frontend:
    build:
      context: ./frontend
      args:
        VUE_APP_API_BASE_URL: http://localhost:8084/api
    user: root
    environment:
      VUE_APP_API_BASE_URL: http://localhost:8084/api
    ports:
      - "8085:80"
    depends_on:
      - backend

volumes:
  postgres_insecure_data:
  mongo_insecure_data:
