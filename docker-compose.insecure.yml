services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_pass}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INIT_DB_ROOT_USERNAME:-mongo_admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INIT_DB_ROOT_PASSWORD:-mongo_pass}
      MONGO_DATABASE: ${MONGO_DATABASE:-mongo_db}
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./backend
    user: root
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-postgres_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_pass}
      MONGO_HOST: mongo
      MONGO_PORT: 27017
      SPRING_DATA_MONGODB_URI: ${SPRING_DATA_MONGODB_URI:-mongodb://mongo_admin:mongo_pass@mongo:27017/mongo_db?authSource=admin}
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INIT_DB_ROOT_USERNAME:-mongo_admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INIT_DB_ROOT_PASSWORD:-mongo_pass}
      MONGO_DATABASE: ${MONGO_DATABASE:-mongo_db}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:8083}
    ports:
      - "8082:8080"
    depends_on:
      - postgres
      - mongo

  frontend:
    build:
      context: ./frontend
      args:
        VUE_APP_API_BASE_URL: http://localhost:8082/api
    user: root
    environment:
      VUE_APP_API_BASE_URL: http://localhost:8082/api
    ports:
      - "8083:80"
    depends_on:
      - backend

volumes:
  postgres_data:
    name: cybersecurity_learning_lab_postgres_data_insecure
  mongo_data:
    name: cybersecurity_learning_lab_mongo_data_insecure
