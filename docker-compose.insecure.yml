services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tfm_lab}
      POSTGRES_USER: ${POSTGRES_USER:-tfm_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tfm_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-vulnlab}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-vulnlab}
      MONGO_DATABASE: ${MONGO_DATABASE:-tfm_lab}
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./backend
    user: root
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-tfm_lab}
      POSTGRES_USER: ${POSTGRES_USER:-tfm_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tfm_password}
      MONGO_HOST: mongo
      MONGO_PORT: 27017
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-vulnlab}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-vulnlab}
      MONGO_DATABASE: ${MONGO_DATABASE:-tfm_lab}
      APP_SECURITY_MODE: ${APP_SECURITY_MODE:-INSECURE}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:8080}
    ports:
      - "8081:8080"
    depends_on:
      - postgres
      - mongo

  frontend:
    build:
      context: ./frontend
      args:
        VUE_APP_API_BASE_URL: http://localhost:8081/api
    user: root
    environment:
      VUE_APP_API_BASE_URL: http://localhost:8081/api
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  postgres_data:
    name: cybersecurity_learning_lab_postgres_data_insecure
  mongo_data:
    name: cybersecurity_learning_lab_mongo_data_insecure
