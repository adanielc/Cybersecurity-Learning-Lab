server:
  port: 8080

spring:
  application:
    name: vulnerable-architecture-lab
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:vulnlab}}
    username: ${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:vulnlab}}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:vulnlab}}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://${MONGO_INITDB_ROOT_USERNAME:vulnlab}:${MONGO_INITDB_ROOT_PASSWORD:vulnlab}@${MONGO_HOST:localhost}:${MONGO_PORT:27017}/${MONGO_DATABASE:vulnlab_docs}?authSource=admin}

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  security:
    cors:
      allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:8081}
    jwt:
      secret: ${JWT_SECRET:${APP_JWT_SECRET:dev-lab-secret-dev-lab-secret-dev-lab-secret}}
