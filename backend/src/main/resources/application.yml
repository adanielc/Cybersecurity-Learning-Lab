server:
  port: 8080

spring:
  application:
    name: vulnerable-architecture-lab
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:postgres_db}}
    username: ${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:postgres_admin}}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:postgres_pass}}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://${MONGO_INITDB_ROOT_USERNAME:mongo_admin}:${MONGO_INITDB_ROOT_PASSWORD:mongo_pass}@${MONGO_HOST:localhost}:${MONGO_PORT:27017}/${MONGO_DATABASE:mongo_db}?authSource=admin}

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  security:
    cors:
      allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:8081}
    jwt:
      secret: ${JWT_SECRET:${APP_JWT_SECRET:jwt_weak_secret}}
