services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vulnlab}
      POSTGRES_USER: ${POSTGRES_USER:-vulnlab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vulnlab}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-vulnlab}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-vulnlab}
      MONGO_DATABASE: ${MONGO_DATABASE:-vulnlab_docs}
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --username $${MONGO_INITDB_ROOT_USERNAME} --password $${MONGO_INITDB_ROOT_PASSWORD} --authenticationDatabase admin --eval \"db.adminCommand('ping').ok\""]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    user: appuser
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-vulnlab}
      POSTGRES_USER: ${POSTGRES_USER:-vulnlab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vulnlab}
      MONGO_HOST: mongo
      MONGO_PORT: 27017
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-vulnlab}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-vulnlab}
      MONGO_DATABASE: ${MONGO_DATABASE:-vulnlab_docs}
      APP_SECURITY_MODE: ${APP_SECURITY_MODE:-INSECURE}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:8083}
    ports:
      - "8082:8080"
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VUE_APP_API_BASE_URL: http://localhost:8082/api
    environment:
      VUE_APP_API_BASE_URL: http://localhost:8082/api
    ports:
      - "8083:80"
    depends_on:
      - backend

volumes:
  postgres_data:
    name: cybersecurity_learning_lab_postgres_data
  mongo_data:
    name: cybersecurity_learning_lab_mongo_data
