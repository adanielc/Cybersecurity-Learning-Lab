services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tfm_lab}
      POSTGRES_USER: ${POSTGRES_USER:-tfm_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tfm_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lab-internal

  mongo:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand({ ping: 1 }).ok\""]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lab-internal

  backend:
    image: scoresby/tfm-cybersecurity-lab-backend:latest
    environment:
      APP_SECURITY_MODE: ${APP_SECURITY_MODE:-INSECURE}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:8080}
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-only-for-local-lab}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/tfm_lab}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-tfm_user}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-tfm_password}
      SPRING_DATA_MONGODB_URI: ${SPRING_DATA_MONGODB_URI:-mongodb://mongo:27017/tfm_lab}
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - lab-internal

  frontend:
    image: scoresby/tfm-cybersecurity-lab-frontend:latest
    depends_on:
      backend:
        condition: service_started
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost/ >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - lab-internal

volumes:
  postgres_data:
  mongo_data:

networks:
  lab-internal:
    internal: true
