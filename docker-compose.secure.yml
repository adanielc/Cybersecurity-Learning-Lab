services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vulnlab}
      POSTGRES_USER: ${POSTGRES_USER:-vulnlab_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-postgres-password}
    volumes:
      - postgres_secure_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - secure_internal

  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-vulnlab_app}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-change-me-mongo-password}
      MONGO_DATABASE: ${MONGO_DATABASE:-vulnlab_docs}
    volumes:
      - mongo_secure_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --username $${MONGO_INITDB_ROOT_USERNAME} --password $${MONGO_INITDB_ROOT_PASSWORD} --authenticationDatabase admin --eval \"db.adminCommand('ping').ok\""]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - secure_internal

  backend:
    build:
      context: ./backend
    user: appuser
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-vulnlab}
      POSTGRES_USER: ${POSTGRES_USER:-vulnlab_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-postgres-password}
      MONGO_HOST: mongo
      MONGO_PORT: 27017
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-vulnlab_app}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-change-me-mongo-password}
      MONGO_DATABASE: ${MONGO_DATABASE:-vulnlab_docs}
      APP_SECURITY_MODE: SECURE
      APP_CORS_ALLOWED_ORIGINS: http://localhost:8083
      APP_JWT_SECRET: ${APP_JWT_SECRET:-change-me-jwt-secret}
    ports:
      - "8082:8080"
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
    networks:
      - secure_internal

  frontend:
    build:
      context: ./frontend
      args:
        VUE_APP_API_BASE_URL: http://localhost:8082/api
    environment:
      VUE_APP_API_BASE_URL: http://localhost:8082/api
    ports:
      - "8083:80"
    depends_on:
      - backend

volumes:
  postgres_secure_data:
  mongo_secure_data:

networks:
  secure_internal:
    internal: true
